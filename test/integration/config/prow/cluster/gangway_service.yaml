apiVersion: v1
kind: Service
metadata:
  name: gangway
  namespace: default
spec:
  selector:
    app: gangway
  ports:
  - name: grpc
    port: 32000
    targetPort: 32000
    # Static band: automatic assignment uses the dynamic band first.
    nodePort: 30000
    protocol: TCP
  - name: metrics
    port: 9090
    protocol: TCP
  type: NodePort
